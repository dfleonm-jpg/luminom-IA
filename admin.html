<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Panel Admin - Luminom IA</title>
  <script src="config.js"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#0A1628" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy:#0A1628; --gold:#C9A84C; --gold-light:#E8C97A;
      --white:#FFFFFF; --off-white:#F8F6F1;
      --text-primary:#0A1628; --text-secondary:#4A5568;
      --border:rgba(10,22,40,0.1);
      --shadow-sm:0 2px 12px rgba(10,22,40,0.08);
      --radius-lg:22px;
      --font-display:'Playfair Display',Georgia,serif;
      --font-body:'Inter',system-ui,sans-serif;
      --success:#10B981; --warning:#F59E0B; --danger:#EF4444;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:var(--font-body);background:var(--off-white);color:var(--text-primary);min-height:100vh;}
    
    .header{background:var(--navy);padding:1.5rem 2rem;box-shadow:0 2px 12px rgba(0,0,0,0.1);}
    .header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
    .logo{color:var(--white);text-decoration:none;font-family:var(--font-display);font-size:1.3rem;font-weight:700;}
    .logo em{font-style:italic;color:var(--gold);}
    .admin-badge{background:var(--gold);color:var(--navy);padding:0.3rem 0.8rem;border-radius:100px;font-size:0.75rem;font-weight:700;}
    .btn-logout{background:transparent;border:1px solid rgba(255,255,255,0.3);color:var(--white);padding:0.5rem 1.2rem;border-radius:100px;font-size:0.85rem;cursor:pointer;}
    
    .container{max-width:1400px;margin:0 auto;padding:2rem;}
    .page-title{font-family:var(--font-display);font-size:2.5rem;font-weight:700;margin-bottom:0.5rem;}
    .page-subtitle{color:var(--text-secondary);margin-bottom:2rem;}
    
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.5rem;margin-bottom:3rem;}
    .stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;}
    .stat-icon{font-size:2rem;margin-bottom:0.5rem;}
    .stat-value{font-family:var(--font-display);font-size:2.5rem;font-weight:700;color:var(--navy);}
    .stat-label{font-size:0.85rem;color:var(--text-secondary);margin-top:0.25rem;}
    
    .section{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem;margin-bottom:2rem;}
    .section-title{font-family:var(--font-display);font-size:1.5rem;font-weight:700;margin-bottom:1.5rem;}
    
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    table{width:100%;border-collapse:collapse;min-width:720px;}
    thead{background:var(--off-white);}
    th{text-align:left;padding:0.75rem;font-size:0.82rem;font-weight:700;color:var(--text-secondary);text-transform:uppercase;white-space:nowrap;}
    td{padding:0.75rem;border-top:1px solid var(--border);font-size:0.9rem;}
    tbody tr{transition:background 0.15s;}
    tbody tr:hover{background:var(--off-white);}
    
    .badge{display:inline-block;padding:0.25rem 0.7rem;border-radius:100px;font-size:0.75rem;font-weight:600;}
    .badge.free{background:#e5e7eb;color:#374151;}
    .badge.premium{background:rgba(201,168,76,0.15);color:var(--gold);}
    .badge.lifetime{background:rgba(16,185,129,0.15);color:var(--success);}
    
    .btn{padding:0.5rem 1rem;border-radius:8px;font-size:0.85rem;font-weight:600;cursor:pointer;border:none;transition:0.2s;}
    .btn-primary{background:var(--gold);color:var(--navy);}
    .btn-primary:hover{background:var(--gold-light);}
    .btn-danger{background:var(--danger);color:white;}
    .btn-danger:hover{opacity:0.9;}
    .btn-small{padding:0.35rem 0.8rem;font-size:0.8rem;}
    
    .loading{text-align:center;padding:3rem;color:var(--text-secondary);}

    @media(max-width:640px){
      .header{padding:1rem;}
      .header-inner{flex-wrap:wrap;gap:0.75rem;}
      .container{padding:1.25rem;}
      .page-title{font-size:1.9rem;}
      .section{padding:1.25rem;}
      .stats-grid{grid-template-columns:1fr 1fr;gap:1rem;}
      .stat-value{font-size:2rem;}
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">Luminom <em>IA</em></a>
      <div style="display:flex;align-items:center;gap:1rem;">
        <span class="admin-badge">ADMIN</span>
        <span style="color:var(--white);font-size:0.9rem;" id="adminName">Cargando...</span>
        <button class="btn-logout" onclick="logout()">Salir</button>
      </div>
    </div>
  </div>

  <div class="container">
    <h1 class="page-title">Panel de Administración</h1>
    <p class="page-subtitle">Gestión de usuarios y suscripciones</p>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">👥</div>
        <div class="stat-value" id="totalUsers">0</div>
        <div class="stat-label">Usuarios Registrados</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon">⭐</div>
        <div class="stat-value" id="premiumUsers">0</div>
        <div class="stat-label">Administradores</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon">👑</div>
        <div class="stat-value" id="lifetimeUsers">0</div>
        <div class="stat-label">Usuarios Estándar</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon">💬</div>
        <div class="stat-value" id="totalChats">0</div>
        <div class="stat-label">Conversaciones Totales</div>
      </div>
    </div>

    <div class="section">
      <h2 class="section-title">📋 Gestión de Usuarios</h2>
      <div id="usersLoading" class="loading">Cargando usuarios...</div>
      <div id="usersTable" style="display:none;">
        <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Email</th>
              <th>Carrera</th>
              <th>Rol</th>
              <th>Fecha Registro</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
          </tbody>
        </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Panel admin vía backend (Node + Express + MongoDB) -->
  <script>
    const API = (window.LUMINOM_CONFIG && window.LUMINOM_CONFIG.BACKEND_URL || '').replace(/\/$/, '');
    const token = localStorage.getItem('luminom_token');
    const session = JSON.parse(localStorage.getItem('luminom_session') || 'null');

    // Control de acceso: debe haber token y rol admin
    if (!token || !session || session.role !== 'admin') {
      alert('⚠️ Acceso denegado. Solo los administradores pueden acceder a este panel.');
      window.location.href = 'index.html';
      throw new Error('Acceso denegado');
    }

    document.getElementById('adminName').textContent = session.name || session.email;

    function logout() {
      localStorage.removeItem('luminom_token');
      localStorage.removeItem('luminom_session');
      window.location.href = 'index.html';
    }
    window.logout = logout;

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    async function loadData() {
      try {
        const res = await fetch(API + '/api/admin/accounts', {
          headers: { Authorization: 'Bearer ' + token },
        });
        if (res.status === 401 || res.status === 403) {
          document.getElementById('usersLoading').textContent =
            '❌ Sesión no válida o sin permisos de administrador. Vuelve a iniciar sesión.';
          return;
        }
        if (!res.ok) throw new Error('Error ' + res.status);
        const accounts = await res.json();

        // Estadísticas
        const admins = accounts.filter(a => a.role === 'admin').length;
        document.getElementById('totalUsers').textContent = accounts.length;
        document.getElementById('premiumUsers').textContent = admins;
        document.getElementById('lifetimeUsers').textContent = accounts.length - admins;

        // Chats totales (opcional, desde /api/stats)
        try {
          const st = await fetch(API + '/api/stats').then(r => r.json());
          document.getElementById('totalChats').textContent = st.attempts ?? 0;
        } catch { /* ignore */ }

        displayUsers(accounts);
      } catch (error) {
        document.getElementById('usersLoading').innerHTML =
          '❌ No se pudo cargar. ¿El backend está activo? (en Render el plan free tarda ~30s en despertar). ' + esc(error.message);
      }
    }

    function displayUsers(accounts) {
      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = '';
      accounts.forEach(a => {
        const created = a.createdAt ? new Date(a.createdAt).toLocaleDateString('es-CO') : 'N/A';
        const roleBadge = a.role === 'admin'
          ? '<span class="badge lifetime">👑 Admin</span>'
          : '<span class="badge free">👤 Usuario</span>';
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>${esc(a.name || '—')}</strong></td>
          <td>${esc(a.email)}</td>
          <td>${esc(a.carrera || 'N/A')}</td>
          <td>${roleBadge}</td>
          <td>${created}</td>
        `;
        tbody.appendChild(row);
      });
      document.getElementById('usersLoading').style.display = 'none';
      document.getElementById('usersTable').style.display = 'block';
    }

    loadData();
  </script>
</body>

</html>
